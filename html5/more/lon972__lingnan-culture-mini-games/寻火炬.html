<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>寻火炬 · 岭南游园会</title>
  <style>
    :root{--paper:#f7f0e3;--ink:#243d36;--red:#c94f35;--jade:#2f8a77;--gold:#e3ad43;--cream:#fffaf0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;display:flex;justify-content:center;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(rgba(36,61,54,.12) .6px,transparent .7px);background-size:8px 8px}
    #gameContainer{width:min(100%,720px);min-height:100svh;position:relative;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:800;text-decoration:none;border:2px solid var(--ink);padding:7px 12px;border-radius:4px;box-shadow:3px 3px 0 var(--ink);background:var(--paper);transition:transform .15s,box-shadow .15s}.back:hover,.back:focus-visible{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);outline:none}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--red)}
    h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(27px,6vw,42px);margin:0;letter-spacing:.08em;line-height:1.05}.intro{margin:2px 0 0;color:rgba(36,61,54,.75);font-size:14px}
    #gameShell{position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--cream);box-shadow:8px 8px 0 var(--ink)}#gameCanvas{display:block;width:100%;height:min(70svh,560px);min-height:360px;cursor:crosshair;touch-action:none;background:var(--cream)}
    .hud{position:absolute;inset:12px 12px auto;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.badge{background:var(--cream);border:2px solid var(--ink);padding:6px 9px;border-radius:4px;font-size:13px;font-weight:900;box-shadow:3px 3px 0 rgba(36,61,54,.72)}#timer{color:var(--red)}
    .progress{position:absolute;left:14px;right:14px;bottom:14px;height:8px;border:1px solid var(--ink);background:var(--paper);border-radius:20px;overflow:hidden;pointer-events:none}#timeBar{height:100%;width:100%;background:var(--red);transform-origin:left;transition:width .25s linear}
    #sceneInfo{min-height:72px;padding:12px 14px;background:var(--cream);border:2px solid var(--ink);border-radius:8px;display:flex;align-items:center;gap:12px}#sceneInfo strong{font-family:Georgia,"Songti SC",serif;font-size:18px;white-space:nowrap}#sceneInfo p{margin:0;font-size:13px;line-height:1.55;color:rgba(36,61,54,.82)}#message{min-height:22px;text-align:center;color:var(--red);font-weight:900;font-size:14px}
    .screen{position:absolute;inset:0;background:rgba(247,240,227,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:5}.screen[hidden]{display:none}.stamp{border:3px solid var(--red);color:var(--red);padding:8px 13px;transform:rotate(-3deg);font-weight:900;letter-spacing:.12em;margin-bottom:20px}.screen h2{font-family:Georgia,"Songti SC",serif;font-size:clamp(28px,7vw,46px);margin:0 0 10px}.screen p{max-width:420px;line-height:1.7;margin:0 0 22px;color:rgba(36,61,54,.78)}.action{border:2px solid var(--ink);background:var(--red);color:#fffaf0;padding:12px 28px;border-radius:4px;font:inherit;font-weight:900;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.action:hover,.action:focus-visible{background:#ad3e29;outline:3px solid var(--gold);outline-offset:3px}.action:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.keyboard{margin-top:18px;font-size:12px;color:rgba(36,61,54,.68)}
    @media(max-width:480px){#gameContainer{padding:14px 12px 20px}.intro{font-size:13px}#gameCanvas{height:62svh;min-height:360px}.hud{inset:10px 10px auto}.badge{font-size:12px;padding:5px 7px}#sceneInfo{align-items:flex-start;flex-direction:column;gap:3px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main id="gameContainer"><header class="topbar"><a class="back" href="index.html" aria-label="返回游戏列表">← 返回游戏列表</a><div class="eyebrow">岭南游园会 / 01</div></header><section><h1>寻火炬</h1><p class="intro">在岭南四城的手绘场景里找到微光火炬 · 90 秒内完成巡游</p></section>
    <section id="gameShell" aria-label="寻火炬游戏区域"><canvas id="gameCanvas" tabindex="0" role="application" aria-label="寻火炬画布，可点击或按方向键移动焦点，再按 Enter 寻找火炬"></canvas><div class="hud"><div class="badge" id="sceneBadge">场景 1 / 4</div><div class="badge" id="timer" aria-live="polite">90 秒</div><div class="badge" id="score">火种 0</div></div><div class="progress" aria-hidden="true"><div id="timeBar"></div></div>
      <div class="screen" id="startScreen"><div class="stamp">岭南 · 四城巡游</div><h2>找到那束火光</h2><p>点按画面寻找火炬。也可以用方向键在场景里移动金色搜寻框，按 Enter 确认。每找到一束火光，就会解锁一段城市故事。</p><button class="action" id="startButton">开始巡游</button><div class="keyboard">支持触控 / 鼠标 / 方向键 + Enter</div></div><div class="screen" id="gameOverScreen" hidden><div class="stamp" id="resultStamp">巡游结束</div><h2 id="resultTitle">时间到</h2><p id="resultText"></p><button class="action" id="restartButton">再来一圈</button></div>
    </section><section id="sceneInfo" aria-live="polite"><strong id="sceneName">香港维多利亚港</strong><p id="sceneDescription">找到火炬后，这段岭南城市故事会在这里展开。</p></section><div id="message" role="status" aria-live="polite">准备好就按“开始巡游”</div>
  </main>
  <script>
    const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');const ui={start:document.getElementById('startScreen'),over:document.getElementById('gameOverScreen'),startBtn:document.getElementById('startButton'),restart:document.getElementById('restartButton'),timer:document.getElementById('timer'),score:document.getElementById('score'),badge:document.getElementById('sceneBadge'),bar:document.getElementById('timeBar'),name:document.getElementById('sceneName'),desc:document.getElementById('sceneDescription'),message:document.getElementById('message'),title:document.getElementById('resultTitle'),text:document.getElementById('resultText'),stamp:document.getElementById('resultStamp')};const C={paper:'#f7f0e3',ink:'#243d36',red:'#c94f35',jade:'#2f8a77',gold:'#e3ad43',cream:'#fffaf0'};
    const scenes=[{name:'香港维多利亚港',description:'海港两岸的灯火与渡轮，见证了香港中西交汇的城市风景。',hint:'找找海风吹过的天际线',draw:drawHongKong},{name:'澳门大三巴',description:'大三巴牌坊的石雕立面，留下了澳门多元文化交融的历史印记。',hint:'火光藏在旧城砖影之间',draw:drawMacau},{name:'广州小蛮腰',description:'广州塔以优雅的“扭腰”曲线连接珠江两岸，是广州的新地标。',hint:'沿着珠江的波纹寻找',draw:drawGuangzhou},{name:'深圳市民中心',description:'展开屋檐像大鹏振翅，市民中心记录着深圳开放、创新的城市气质。',hint:'大鹏的翅膀下有微光',draw:drawShenzhen}];
    const state={playing:false,scene:0,score:0,left:90,torch:{x:.5,y:.5},focus:{x:.5,y:.5},found:false,raf:0,transitionId:0,run:0,particles:[],last:0};function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);if(state.playing)draw()}function W(){return canvas.clientWidth}function H(){return canvas.clientHeight}function inkText(text,x,y,size=14,align='left'){ctx.fillStyle=C.ink;ctx.font=`700 ${size}px "PingFang SC","Noto Sans CJK SC",sans-serif`;ctx.textAlign=align;ctx.fillText(text,x,y)}function drawBase(){ctx.fillStyle=C.cream;ctx.fillRect(0,0,W(),H());ctx.fillStyle='rgba(36,61,54,.045)';for(let x=0;x<W();x+=28)ctx.fillRect(x,0,1,H());for(let y=0;y<H();y+=28)ctx.fillRect(0,y,W(),1);ctx.fillStyle='rgba(227,173,67,.18)';ctx.beginPath();ctx.arc(W()*.88,H()*.18,70,0,Math.PI*2);ctx.fill()}
    function drawHongKong(){drawBase();const w=W(),h=H();ctx.fillStyle='#d6e8df';ctx.fillRect(0,h*.64,w,h*.36);ctx.fillStyle='#b9d8cf';ctx.beginPath();ctx.moveTo(0,h*.69);ctx.quadraticCurveTo(w*.2,h*.57,w*.45,h*.69);ctx.quadraticCurveTo(w*.72,h*.76,w,h*.63);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();for(let i=0;i<12;i++){const x=w*.05+i*w*.076,hh=35+(i%4)*22;ctx.fillStyle=i%2?C.ink:C.jade;ctx.fillRect(x,h*.64-hh,w*.055,hh);ctx.fillStyle=C.gold;for(let yy=h*.66-hh;yy<h*.63;yy+=12)ctx.fillRect(x+5,yy,4,4)}ctx.fillStyle=C.red;ctx.fillRect(w*.73,h*.38,w*.07,h*.26);ctx.fillStyle=C.ink;ctx.beginPath();ctx.moveTo(w*.765,h*.38);ctx.lineTo(w*.765,h*.22);ctx.lineTo(w*.79,h*.22);ctx.lineTo(w*.79,h*.38);ctx.fill();ctx.strokeStyle=C.red;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(w*.76,h*.64);ctx.quadraticCurveTo(w*.63,h*.55,w*.58,h*.7);ctx.stroke();inkText('维多利亚港',20,h-22,15)}
    function drawMacau(){drawBase();const w=W(),h=H();ctx.fillStyle='#dfc9a6';ctx.fillRect(0,h*.65,w,h*.35);ctx.fillStyle='#c9a77a';for(let i=0;i<7;i++)ctx.fillRect(i*w/7,h*.66,1,h*.34);ctx.fillStyle=C.red;ctx.beginPath();ctx.moveTo(w*.22,h*.67);ctx.lineTo(w*.27,h*.31);ctx.quadraticCurveTo(w*.5,h*.13,w*.73,h*.31);ctx.lineTo(w*.78,h*.67);ctx.closePath();ctx.fill();ctx.fillStyle=C.paper;ctx.beginPath();ctx.moveTo(w*.31,h*.64);ctx.lineTo(w*.34,h*.34);ctx.quadraticCurveTo(w*.5,h*.22,w*.66,h*.34);ctx.lineTo(w*.69,h*.64);ctx.closePath();ctx.fill();ctx.fillStyle=C.gold;for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(w*(.35+i*.075),h*.41,7,0,Math.PI*2);ctx.fill()}ctx.fillStyle=C.ink;ctx.fillRect(w*.42,h*.53,w*.16,h*.14);ctx.fillStyle=C.paper;ctx.fillRect(w*.46,h*.56,w*.08,h*.11);inkText('大三巴牌坊',20,h-22,15)}
    function drawGuangzhou(){drawBase();const w=W(),h=H();ctx.fillStyle='#b8d8ce';ctx.fillRect(0,h*.76,w,h*.24);ctx.strokeStyle='#8dbdaf';ctx.lineWidth=3;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,h*(.8+i*.035));ctx.quadraticCurveTo(w*.45,h*(.77+i*.035),w,h*(.81+i*.035));ctx.stroke()}ctx.fillStyle=C.jade;ctx.beginPath();ctx.moveTo(w*.43,h*.78);ctx.quadraticCurveTo(w*.47,h*.59,w*.45,h*.29);ctx.quadraticCurveTo(w*.5,h*.17,w*.55,h*.29);ctx.quadraticCurveTo(w*.53,h*.59,w*.57,h*.78);ctx.closePath();ctx.fill();ctx.fillStyle=C.red;ctx.beginPath();ctx.moveTo(w*.43,h*.78);ctx.lineTo(w*.3,h*.4);ctx.lineTo(w*.33,h*.38);ctx.lineTo(w*.48,h*.73);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(w*.57,h*.78);ctx.lineTo(w*.7,h*.4);ctx.lineTo(w*.67,h*.38);ctx.lineTo(w*.52,h*.73);ctx.closePath();ctx.fill();ctx.fillStyle=C.gold;for(let y=h*.36;y<h*.71;y+=25)ctx.fillRect(w*.46,y,w*.08,4);inkText('广州塔 · 小蛮腰',20,h-22,15)}
    function drawShenzhen(){drawBase();const w=W(),h=H();ctx.fillStyle='#c7ddd2';ctx.fillRect(0,h*.7,w,h*.3);ctx.fillStyle=C.ink;ctx.beginPath();ctx.moveTo(w*.12,h*.69);ctx.quadraticCurveTo(w*.3,h*.46,w*.5,h*.55);ctx.quadraticCurveTo(w*.7,h*.46,w*.88,h*.69);ctx.lineTo(w*.77,h*.69);ctx.quadraticCurveTo(w*.65,h*.57,w*.5,h*.62);ctx.quadraticCurveTo(w*.35,h*.57,w*.23,h*.69);ctx.closePath();ctx.fill();ctx.fillStyle=C.red;ctx.fillRect(w*.19,h*.65,w*.62,h*.16);ctx.fillStyle=C.gold;for(let i=0;i<9;i++)ctx.fillRect(w*(.22+i*.07),h*.68,5,8);ctx.fillStyle=C.jade;ctx.beginPath();ctx.arc(w*.15,h*.45,30,0,Math.PI*2);ctx.arc(w*.86,h*.45,38,0,Math.PI*2);ctx.fill();inkText('深圳市民中心',20,h-22,15)}
    function drawTorch(){if(state.found)return;const x=state.torch.x*W(),y=state.torch.y*H(),r=27;ctx.save();ctx.shadowColor='rgba(201,79,53,.45)';ctx.shadowBlur=20;ctx.fillStyle='rgba(227,173,67,.28)';ctx.beginPath();ctx.arc(x,y,44,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=C.ink;ctx.fillRect(x-5,y+7,10,22);ctx.fillStyle=C.red;ctx.beginPath();ctx.moveTo(x,y-28);ctx.bezierCurveTo(x-17,y-10,x-12,y+5,x,y+9);ctx.bezierCurveTo(x+13,y+3,x+15,y-11,x,y-28);ctx.fill();ctx.fillStyle=C.gold;ctx.beginPath();ctx.moveTo(x,y-19);ctx.bezierCurveTo(x-8,y-8,x-5,y+1,x,y+4);ctx.bezierCurveTo(x+7,y-2,x+7,y-9,x,y-19);ctx.fill();ctx.strokeStyle=C.cream;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-4,35,0,Math.PI*2);ctx.stroke();ctx.restore()}
    function drawFocus(){if(!state.playing||state.found)return;const x=state.focus.x*W(),y=state.focus.y*H();ctx.save();ctx.strokeStyle='rgba(227,173,67,.9)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.stroke();ctx.restore()}function draw(){ctx.clearRect(0,0,W(),H());scenes[state.scene].draw();drawTorch();drawFocus();drawParticles()}function drawParticles(){state.particles=state.particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.025;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);return p.life>0});ctx.globalAlpha=1}function burst(x,y){for(let i=0;i<22;i++){const a=Math.PI*2*i/22,s=1+Math.random()*2;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,color:i%2?C.gold:C.red})}}
    function placeTorch(){const x=.18+Math.random()*.64,y=.22+Math.random()*.5;state.torch={x,y};state.focus={x,y}}function updateInfo(){const s=scenes[state.scene];ui.name.textContent=s.name;ui.desc.textContent=state.found?s.description:`${s.hint}。找到它就能解锁城市故事。`;ui.badge.textContent=`场景 ${state.scene+1} / ${scenes.length}`}function updateHUD(){ui.timer.textContent=`${Math.max(0,Math.ceil(state.left))} 秒`;ui.score.textContent=`火种 ${state.score}`;ui.bar.style.width=`${Math.max(0,state.left/90*100)}%`}
    function loop(now){if(!state.playing)return;const dt=Math.min(.05,(now-state.last)/1000||0);state.last=now;state.left-=dt;updateHUD();if(state.left<=0){endGame();return}draw();state.raf=requestAnimationFrame(loop)}function clearRun(){cancelAnimationFrame(state.raf);clearTimeout(state.transitionId);state.run++}function start(){clearRun();state.playing=true;state.scene=0;state.score=0;state.left=90;state.found=false;state.particles=[];placeTorch();ui.start.hidden=true;ui.over.hidden=true;ui.message.textContent='找到火炬，开启第一段城市故事';updateInfo();updateHUD();resize();state.last=performance.now();state.raf=requestAnimationFrame(loop);canvas.focus()}
    function endGame(){state.playing=false;cancelAnimationFrame(state.raf);ui.over.hidden=false;ui.title.textContent=state.score>=400?'四城巡游完成！':'时间到';ui.text.textContent=`你收集了 ${state.score/100} 束火种，走过 ${Math.min(state.scene+1,4)} 座岭南城市。`;ui.stamp.textContent=state.score>=400?'满载而归':'再来一圈';ui.message.textContent='本轮巡游已结束'}function found(){if(!state.playing||state.found)return;state.found=true;state.score+=100;burst(state.torch.x*W(),state.torch.y*H());updateHUD();updateInfo();ui.message.textContent=`找到了！${scenes[state.scene].name}的故事已解锁`;const run=state.run;state.transitionId=setTimeout(()=>{if(run!==state.run||!state.playing)return;if(state.scene===scenes.length-1){endGame();return}state.scene++;state.found=false;placeTorch();updateInfo();ui.message.textContent=`下一站：${scenes[state.scene].name}`},850)}
    function hit(x,y){return Math.hypot(x-state.torch.x*W(),y-state.torch.y*H())<=34}function pointer(e){if(!state.playing||state.found)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W()/r.width,y=(e.clientY-r.top)*H()/r.height;if(hit(x,y)){state.focus={x:x/W(),y:y/H()};found()}else ui.message.textContent='再靠近一点，火光就在附近。'}function key(e){if(!state.playing||state.found)return;const step=.08;let{x,y}=state.focus;if(e.key==='ArrowLeft')x-=step;if(e.key==='ArrowRight')x+=step;if(e.key==='ArrowUp')y-=step;if(e.key==='ArrowDown')y+=step;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();state.focus={x:Math.max(.04,Math.min(.96,x)),y:Math.max(.12,Math.min(.88,y))};ui.message.textContent='搜寻框已移动，按 Enter 检查这里';draw()}if(e.key==='Enter'||e.key===' '){e.preventDefault();if(hit(state.focus.x*W(),state.focus.y*H()))found();else ui.message.textContent='这里没有火炬，继续寻找。'}}
    ui.startBtn.addEventListener('click',start);ui.restart.addEventListener('click',start);canvas.addEventListener('pointerdown',pointer);canvas.addEventListener('keydown',key);window.addEventListener('resize',resize);resize();updateInfo();
  </script>
</body>
</html>
