<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>岭南建筑拼图 · 岭南游园会</title>
<style>
:root{--paper:#f7f0e3;--ink:#243d36;--red:#c94f35;--jade:#2f8a77;--gold:#e3ad43;--shadow:0 12px 30px #243d3620}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;background:radial-gradient(#e3ad4330 1px,transparent 1px) 0 0/18px 18px;min-height:100vh}button,a{font:inherit}button{cursor:pointer}.shell{width:min(100% - 28px,980px);margin:auto;padding:18px 0 48px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:var(--ink);text-decoration:none;font-weight:700;border-bottom:2px solid var(--red);padding:4px 0}.eyebrow{letter-spacing:.18em;font-size:.75rem;color:var(--red);font-weight:800}.masthead{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:3px solid var(--ink);padding:12px 0 20px}.masthead h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(2rem,6vw,4.4rem);line-height:.95;margin:8px 0 0}.masthead p{max-width:310px;margin:0;color:#243d36b8;line-height:1.7}.notice{margin:18px 0;padding:12px 16px;border:1px dashed var(--gold);background:#fffaf0cc;font-size:.85rem}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{border:2px solid var(--ink);background:#fffaf0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;text-align:left}.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 16px 34px #243d3630}.card:focus-visible{outline:4px solid #e3ad4380;outline-offset:2px}.card img{display:block;width:100%;aspect-ratio:1.35;object-fit:cover;border-bottom:2px solid var(--ink)}.card-body{display:block;padding:15px}.card h2{font-family:Georgia,"Songti SC",serif;font-size:1.4rem;margin:0 0 5px}.card p{margin:0;line-height:1.6;font-size:.88rem;color:#243d36c7}.game{display:none}.game.active{display:block}.game-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0}.icon-btn,.action{border:2px solid var(--ink);background:#fffaf0;color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}.icon-btn{border-radius:10px}.timer{background:var(--red);color:#fffaf0;border-color:var(--ink);min-width:96px;text-align:center}.timer.warning{background:var(--gold);color:var(--ink)}.building-title{font-family:Georgia,"Songti SC",serif;font-size:1.5rem;font-weight:800}.board{width:min(92vw,650px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px;background:var(--ink);border:5px solid var(--ink);border-radius:10px;box-shadow:var(--shadow);touch-action:none}.cell{min-width:0;aspect-ratio:1;background:#ffffff20;border:1px dashed #f7f0e380;display:flex;align-items:stretch;justify-content:stretch;position:relative}.cell.target{background:#e3ad4338;outline:3px solid var(--gold);outline-offset:-3px}.piece{width:100%;height:100%;border:0;background-color:var(--paper);background-repeat:no-repeat;background-size:400% 400%;user-select:none;touch-action:none;cursor:grab}.piece.selected{outline:4px solid var(--gold);outline-offset:-4px;filter:saturate(1.2)}.piece:focus-visible{outline:4px solid #fff;outline-offset:-5px}.piece.dragging{opacity:.5}.pool{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:18px auto 12px;width:min(92vw,650px);padding:10px;border:2px dashed var(--jade);background:#fffaf080;border-radius:10px;min-height:74px}.pool .piece{aspect-ratio:1;border-radius:4px}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.action.primary{background:var(--jade);color:#fffaf0}.action.hint{background:var(--gold)}.help{text-align:center;color:#243d3699;font-size:.82rem;margin:12px 0}.modal{position:fixed;inset:0;background:#243d3699;display:grid;place-items:center;padding:18px;z-index:5}.modal[hidden]{display:none}.dialog{background:var(--paper);border:3px solid var(--ink);border-radius:14px;max-width:560px;width:100%;padding:24px;box-shadow:10px 10px 0 #243d36}.dialog h2{font-family:Georgia,"Songti SC",serif;font-size:2rem;margin:0 0 8px}.dialog img{display:block;width:100%;max-height:300px;object-fit:cover;border:2px solid var(--ink);margin:16px 0}.dialog p{line-height:1.75}.dialog-actions{display:flex;gap:10px;justify-content:flex-end}.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);padding:3px 8px;transform:rotate(-3deg);font-weight:900;font-size:.75rem}@media(max-width:700px){.choice-grid{grid-template-columns:1fr}.choice-grid .card{display:grid;grid-template-columns:120px 1fr}.card img{height:100%;aspect-ratio:auto;border-right:2px solid var(--ink);border-bottom:0}.masthead{display:block}.masthead p{margin-top:14px}.pool{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><div class="topbar"><a class="back" href="index.html">← 返回游戏集</a><span class="eyebrow">岭南游园会 · 01</span></div><section id="start"><div class="masthead"><div><div class="eyebrow">LOCAL ARCHITECTURE / PUZZLE</div><h1>岭南建筑拼图</h1></div><p>把一幅建筑插画重新拼好，读懂岭南屋檐、街廊与院落的巧思。</p></div><div class="notice">插画为本游戏绘制的文化示意图，用于帮助识别建筑特征，并非真实建筑照片。</div><div class="choice-grid" id="choices"></div></section><section id="game" class="game" aria-live="polite"><div class="game-head"><button class="icon-btn" id="backBtn" type="button">← 选建筑</button><div class="building-title" id="buildingTitle"></div><div class="timer" id="timer" role="timer">120s</div></div><div class="board" id="board" aria-label="4乘4拼图棋盘"></div><div class="pool" id="pool" aria-label="待放置拼图"></div><div class="controls"><button class="action" id="resetBtn" type="button">↻ 重置</button><button class="action hint" id="hintBtn" type="button">✦ 提示（-5秒）</button></div><p class="help">拖动、点击选中后再点击格子，或用触控操作放置拼图；占用的格子会自动交换。</p></section></main><div class="modal" id="modal" hidden><article class="dialog"><span class="stamp">完成游园挑战</span><h2 id="modalTitle"></h2><img id="modalImage" alt="建筑插画"><div id="modalText"></div><div class="dialog-actions"><button class="action" id="modalClose" type="button">回到选择</button><button class="action primary" id="modalAgain" type="button">再玩一次</button></div></article></div><div class="modal" id="timeModal" hidden><article class="dialog"><span class="stamp">本轮结束</span><h2>时间到啦</h2><p>别急，熟悉屋檐和街廊的形状后再来一局。</p><div class="dialog-actions"><button class="action" id="timeBack" type="button">换个建筑</button><button class="action primary" id="timeAgain" type="button">再试一次</button></div></article></div>
<script>
const root='assets/buildings/';const buildings={chenjia:{name:'陈家祠',file:'chenjia.svg',tag:'木石砖雕的祠堂门面',text:'陈家祠又称陈氏书院。它以严谨的院落布局和木雕、砖雕、石雕等装饰闻名，是岭南传统祠堂工艺的集中展示。'},qilou:{name:'骑楼',file:'qilou.svg',tag:'遮阳避雨的街廊',text:'骑楼把上层建筑跨在人行道上，形成连续的柱廊。它适应岭南多雨炎热的气候，也让街道保留了热闹的商业生活。'},huoer:{name:'镬耳屋',file:'huoer.svg',tag:'高耸的镬耳山墙',text:'镬耳屋以两侧高起、像铁锅耳朵的山墙得名。高墙有助于通风、防火，是珠江三角洲民居智慧的鲜明符号。'}};const state={building:null,pieces:[],selected:null,dragged:null,seconds:120,timer:null,playing:false};const $=s=>document.querySelector(s),choices=$('#choices'),start=$('#start'),game=$('#game'),board=$('#board'),pool=$('#pool'),timer=$('#timer'),modal=$('#modal'),timeModal=$('#timeModal');
function renderChoices(){choices.innerHTML=Object.entries(buildings).map(([id,b])=>`<button class="card" data-id="${id}" type="button"><img src="${root+b.file}" alt="${b.name}示意插画"><span class="card-body"><span class="eyebrow">BUILDING ${id==='chenjia'?'01':id==='qilou'?'02':'03'}</span><h2>${b.name}</h2><p>${b.tag}</p></span></button>`).join('');choices.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>startGame(c.dataset.id)));}function startGame(id){stopTimer();closeModals();state.building=buildings[id];state.playing=true;state.seconds=120;state.selected=null;start.hidden=true;game.classList.add('active');$('#buildingTitle').textContent=state.building.name;renderPuzzle();updateTimer();state.timer=setInterval(()=>{if(!state.playing)return;state.seconds--;updateTimer();if(state.seconds<=0)timeUp();},1000)}function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}function updateTimer(){timer.textContent=`${state.seconds}s`;timer.classList.toggle('warning',state.seconds<=30)}
function renderPuzzle(){board.innerHTML='';pool.innerHTML='';state.pieces=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++){const cell=document.createElement('div');cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;cell.addEventListener('dragover',e=>e.preventDefault());cell.addEventListener('drop',e=>{e.preventDefault();if(state.dragged)place(state.dragged,cell)});cell.addEventListener('click',()=>{if(state.selected)place(state.selected,cell)});board.append(cell);const p=document.createElement('button');p.type='button';p.className='piece';p.dataset.r=r;p.dataset.c=c;p.dataset.correct='false';p.style.backgroundImage=`url("${root}${state.building.file}")`;p.style.backgroundPosition=`${c*100/3}% ${r*100/3}%`;p.setAttribute('aria-label',`${state.building.name}第${r*4+c+1}块`);p.draggable=true;p.addEventListener('dragstart',e=>{state.dragged=p;p.classList.add('dragging');e.dataTransfer.setData('text/plain','piece')});p.addEventListener('dragend',()=>{p.classList.remove('dragging');state.dragged=null});p.addEventListener('click',e=>{e.stopPropagation();select(p)});p.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')select(p)});state.pieces.push(p);pool.append(p)}shuffle(state.pieces);state.pieces.forEach(p=>pool.append(p))}function select(p){if(!state.playing)return;if(state.selected)state.selected.classList.remove('selected');state.selected=p;p.classList.add('selected')}function place(piece,target){if(!state.playing||!piece||!target)return;const source=piece.parentElement;if(target===pool){pool.append(piece);clearSelection();check();return}const occupant=target.querySelector('.piece');if(occupant&&occupant!==piece){if(source===pool)pool.append(occupant);else source.append(occupant)}target.append(piece);clearSelection();check()}function clearSelection(){if(state.selected)state.selected.classList.remove('selected');state.selected=null;state.dragged=null}function check(){let count=0;board.querySelectorAll('.cell').forEach(cell=>{const p=cell.querySelector('.piece');if(p){const yes=p.dataset.r===cell.dataset.r&&p.dataset.c===cell.dataset.c;p.dataset.correct=yes?'true':'false';if(yes)count++}});if(count===16)complete()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((p,i)=>p.dataset.r===String(Math.floor(i/4))&&p.dataset.c===String(i%4)))shuffle(a)}
function showHint(){if(!state.playing)return;const open=state.pieces.filter(p=>p.dataset.correct!=='true');if(!open.length)return;const p=open[Math.floor(Math.random()*open.length)],cell=[...board.children].find(c=>c.dataset.r===p.dataset.r&&c.dataset.c===p.dataset.c);cell.classList.add('target');setTimeout(()=>cell.classList.remove('target'),2000);state.seconds=Math.max(0,state.seconds-5);updateTimer();if(state.seconds===0)timeUp()}function complete(){state.playing=false;stopTimer();$('#modalTitle').textContent=`${state.building.name} · 拼好了！`,$('#modalImage').src=root+state.building.file,$('#modalImage').alt=state.building.name+'示意插画',$('#modalText').innerHTML=`<p>${state.building.text}</p><p class="help">这是一幅原创示意插画，用来突出建筑轮廓与构造特征。</p>`,modal.hidden=false}function timeUp(){if(!state.playing)return;state.playing=false;stopTimer();timeModal.hidden=false}function closeModals(){modal.hidden=true;timeModal.hidden=true}function back(){state.playing=false;stopTimer();closeModals();game.classList.remove('active');start.hidden=false}function currentId(){return Object.keys(buildings).find(k=>buildings[k]===state.building)}$('#backBtn').addEventListener('click',back);$('#resetBtn').addEventListener('click',()=>state.building&&startGame(currentId()));$('#hintBtn').addEventListener('click',showHint);$('#modalAgain').addEventListener('click',()=>startGame(currentId()));$('#modalClose').addEventListener('click',back);$('#timeAgain').addEventListener('click',()=>startGame(currentId()));$('#timeBack').addEventListener('click',back);renderChoices();
pool.addEventListener('dragover',e=>e.preventDefault());pool.addEventListener('drop',e=>{e.preventDefault();if(state.dragged)place(state.dragged,pool)});pool.addEventListener('click',()=>{if(state.selected)place(state.selected,pool)});
</script></body></html>
