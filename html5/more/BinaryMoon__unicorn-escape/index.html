<html lang="en">

<head>

	<title>Unicorn Escape</title>

	<style>
		* {
			margin: 0;
			padding: 0;
		}

		body {

			display: flex;
			flex-direction: column;
			height: 100vh;
			justify-content: center;
		}
	</style>
</head>

					else if ( Math.abs( player.vx ) > 12 ) player._facing = Math.sign( player.vx );
					if ( !flight._active ) {
						player.vx += direction * config[ CONFIG_AIR_ACCELERATION ] * player._airControlMultiplier * deltaTime;
						player.vx *= .94;
						player.vx = bm.Util.clamp( player.vx, -config[ CONFIG_AIR_MAXIMUM_SPEED ] * player._airControlMultiplier, config[ CONFIG_AIR_MAXIMUM_SPEED ] * player._airControlMultiplier );
					}

					// Resolve several short movements instead of one long leap. This prevents
					// a fast-falling player crossing a thin rainbow between two game frames.
					const collisionSteps = 4;
					const stepTime = deltaTime / collisionSteps;
					for ( let step = 0; step < collisionSteps; step++ ) {

						const previousX = player.x;
						const previousY = player.y;

						if ( !flight._active ) player.vy += config[ CONFIG_GRAVITY ] * stepTime;
						player.x += player.vx * stepTime;
						player.y += player.vy * stepTime;

						player.x = bm.Util.clamp(
							player.x,
							player.radius,
							Unicorn._level.width - player.radius
						);

						player._bounced = false;
						const hitSurface = resolvePlayerCollisions( previousX, previousY );
						if ( hitSurface ) {

							player._jumpGrace = config[ CONFIG_TAP_JUMP_BUFFER ];
							// Automatic upward bounces get a quiet response; manual jumps have their own sound.
							if ( player._bounced && !player._jumpBuffer ) bm.Audio.beep( 180, .025, 'sine' );

						}
						if ( tryTapJump() && holdingFlight && !flight._active ) captureFlightDirection();
						if ( flight._active && hitSurface ) finishFlight();


					}

					// Update visual movement and the persistent rainbow trail.
					// Smooth only the artwork's lean; physics continues to use the exact velocity.
					const targetAngle = Math.atan2( player.vy, Math.max( 1, Math.abs( player.vx ) ) ) * .25 * player._facing;
					player._visualAngle += ( targetAngle - player._visualAngle ) * Math.min( 1, deltaTime * 10 );

					// A trail begins only once Red is found; later colours improve the same trail.
					Unicorn._updateRainbow( rainbow, player, hasColour( 0 ) && Math.hypot( player.vx, player.vy ) > 8, deltaTime );
					if ( !escaped && player.y < 0 ) {
						escaped = true;
						showMessage( 'GAME COMPLETE!', `TIME ${formatTime()}` );
						bm.Audio.beep( 740, .14, 'sine' ); // Rainbow pickup beep.
						playMusic( MUSIC_WIN );
					}

					// Follow the player after resolving the frame's world movement.
					// Keep the unicorn slightly left of centre so forward terrain remains visible.
					const cameraTarget = clampCamera( player.x - width * .42, Unicorn._level.width, width, cameraPaddingX );
					cameraX += ( cameraTarget - cameraX ) * Math.min( 1, deltaTime * 5 );

					// The cave continues into open sky, but never scroll past its lower edge.
					const verticalTarget = Math.min( player.y - height * CAMERA_OFFSET, Unicorn._level.height - height - cameraPaddingY );
					const verticalDistance = verticalTarget - cameraY;
					// Small bounce movement stays on screen before the camera begins to follow.
					const verticalDeadzone = config[ CONFIG_CAMERA_VERTICAL_DEADZONE ];
					if ( Math.abs( verticalDistance ) > verticalDeadzone ) cameraY += ( verticalDistance - Math.sign( verticalDistance ) * verticalDeadzone ) * Math.min( 1, deltaTime * 5 );

					// Resolve progression and world-object interactions.
					for ( const part of Unicorn._level.rainbowParts || [] ) {
						if ( !part._collected && Math.hypot( player.x - part.x, player.y - part.y ) < player.radius + part.radius ) {
							part._collected = true;
							setColourMask( colourMask | 1 << part.colour, part.colour );

							// A brief same-colour burst makes the small pickup feel rewarding.
							burst( part.x, part.y, rainbowColours[ part.colour ], 9 );
							bm.Audio.beep( 980, .16, 'sine' ); // Pickup rainbow beep.
						}
					}
					// Pickup diamonds are carried and stacked above the unicorn, then used on nearby sockets.
					for ( let index = diamonds.length - 1; index >= 0; index-- ) {
						const diamond = diamonds[ index ];
						if ( !diamond._carried && !diamond._used && Math.hypot( player.x - diamond.x, player.y - diamond.y ) < player.radius + 14 ) {
							diamond._carried = true;
							bm.Audio.beep( 1100, .1, 'sine' ); // Diamond pickup beep.
						}
					}
					// A simple lerp keeps stacked keys smooth without spring velocity state.
					let carriedCount = 0;
					for ( const diamond of diamonds ) {
						if ( !diamond._carried || diamond._used ) continue;
						const targetY = player.y - config[ CONFIG_DIAMOND_FOLLOW_HEIGHT ] - carriedCount++ * config[ CONFIG_DIAMOND_STACK_SPACING ];
						diamond._drawX ??= player.x;
						diamond._drawY ??= targetY;
						diamond._drawX += ( player.x - diamond._drawX ) * Math.min( 1, deltaTime * 12 );
						diamond._drawY += ( targetY - diamond._drawY ) * Math.min( 1, deltaTime * 12 );
					}

					// A carried key opens a nearby unused door immediately.
					const carried = diamonds.find( diamond => diamond._carried );
					const socket = ( Unicorn._level.sockets || [] ).find( item => !Unicorn._level.doors[ item.door ]._opened && Math.hypot( player.x - item.x, player.y - item.y ) < config[ CONFIG_DIAMOND_SOCKET_RADIUS ] );
					if ( carried && socket ) {
						carried._carried = false;
						carried._used = true;
						Unicorn._level.doors[ socket.door ]._opened = true;
						burst( socket.x, socket.y, rainbowColours[ 2 ], 11 );
						bm.shake( 6, .18 );
						bm.Audio.beep( 180, .18, 'sine' ); // Door open beep.
					}

					// Restart only after the player falls below the authored cave.
					if ( player.y > Unicorn._level.height + 40 ) reset();
				}
				bm.Input.endFrame();

			}


			/**
			 * Render the complete visible game state in BeepMicro's vector style.
			 *
			 * @returns {void}
			 */
			function render() {

				// Draw the splash separately because it is entirely screen-relative.
				Unicorn._drawBackground();
				if ( !playing ) {

					// Splash particles are screen-space and therefore draw without world-camera offsets.
					bm.Particles.draw();
					Unicorn._drawSplash( width, height );
					return;

				}

				// Draw world layers back to front, then render screen-space HUD elements.
				Unicorn._drawSky(
					Unicorn._level,
					width,
					height,
					cameraX,
					cameraY
				);
				Unicorn._drawScenery( Unicorn._level.scenery, cameraX, cameraY );
				Unicorn._drawSolidObjects( Unicorn._level.solids, cameraX, cameraY );
				Unicorn._drawTerrain( Unicorn._level.terrain, cameraX, cameraY );
				Unicorn._drawRainbow( rainbow, cameraX, cameraY );
				Unicorn._drawObjects(
					player,
					Unicorn._level,
					diamonds,
					message,
					width,
					height,
					cameraX,
					cameraY,
					flight,
					elapsedTime,
					escaped
				);
				Unicorn._drawColourProgress( colourMask, width );
				bm.Particles.draw( cameraX, cameraY );

			}

			bindControls();
			bindSplash();
			reset();
			bm.frame( update, render );

		}() );


	</script>
</body>
