function paintSplit(paint, seam, left, right) {
	C.save()
	C.beginPath()
	C.rect(0, 0, seam, H)
	C.clip()
	paint(left)
	C.restore()
	C.save()
	C.beginPath()
	C.rect(seam, 0, W - seam, H)
	C.clip()
	paint(right)
	C.restore()
}

// Returns where the seam falls on screen, or -1 when it is off screen, and
// leaves the two worlds to paint in seamSides.
var seamSides = [0, 0]
function seamAt() {
	var s
	if (!endless || stagePhase != 1) {
		return -1
	}
	s = uniX + stageStartX + stageLen - X          // la frontiere devant elle
	if (s < W) {
		seamSides[0] = stage % worlds.length
		seamSides[1] = (stage + 1) % worlds.length
		return s
	}
	s = uniX + stageStartX - X                     // celle qu elle vient de franchir
	if (seamFrom >= 0 && s > 0) {
		seamSides[0] = seamFrom % worlds.length
		seamSides[1] = stage % worlds.length
		return s
	}
	seamFrom = -1
	return -1
}

function paintWorld(paint, k) {
	var s = seamAt()
	if (s < 0) {
		paint(k)
		return
	}
	paintSplit(paint, s, seamSides[0], seamSides[1])
}

// Paints one whole frame: the world, the unicorn, the interface, and whichever
// screen the current state calls for, title, stage card or score.
function drawFrame() {
	var i, e, g, q, x, y, t, j, CJ, k = stage % worlds.length

	paintWorld(drawScenery, k)

	C.save()
	if (shake > 0) {
		C.translate((M.random() - .5) * 18 * shake, (M.random() - .5) * 18 * shake)
	}

	if (trail.length > 3) {
		C.lineCap = 'round'
		C.lineJoin = 'round'
		// The trail dies out into the sky instead of being cut off, the way it
		// already does on the home screen. The fade is in the colour rather than
		// in globalAlpha, so the far end really reaches nothing.
		x = uniX + trail[0] - X                        // where the oldest point is
		for (i = 0; i < 7; i++) {
			g = C.createLinearGradient(x, 0, uniX, 0)
			g.addColorStop(0, 'hsla(' + i * 44 + ',95%,62%,0)')
			g.addColorStop(1, 'hsla(' + i * 44 + ',95%,62%,.5)')
			C.strokeStyle = g
			C.lineWidth = uniSize * .30 - i * uniSize * .035
			C.beginPath()
			C.moveTo(x, trail[1])
			for (e = 2; e < trail.length; e += 2) {
				C.lineTo(uniX + trail[e] - X, trail[e + 1])
			}
			C.stroke()
		}
	}

	if (hold && state == 1) {
		C.lineCap = 'round'
		for (i = 0; i < 7; i++) {
			C.strokeStyle = 'hsl(' + i * 44 + ',95%,62%)'
			C.lineWidth = uniSize * .065
			C.beginPath()
			C.moveTo(uniDrawX - uniSize * .18 + i * uniSize * .05, Y + uniSize * .26)
			C.lineTo(uniDrawX - uniSize * .27 + i * uniSize * .05, Y + uniSize * .30 + uniSize * (.26 + M.random() * .2))
			C.stroke()
		}
	}

	// doubled, the coins turn from gold to orange
	CJ = gemTime[2] > 0 ? ['#ff82324c', '#a33b10', '#ff7a2b', '#ffd7b0'] : COIN
	for (i = 0; i < coinList.length; i++) {
		e = coinList[i]
		x = uniX + e.x - X
		if (x < -30 || x > W + 30) {
			continue
		}
		// a golden ring seen face on, spinning about its vertical axis
		drawCoin(x, e.y, uniSize, X * .008 + e.x * .055, CJ)
	}

	for (i = 0; i < gemList.length; i++) {
		e = gemList[i]
		x = uniX + e.x - X
		if (x < -40 || x > W + 40) {
			continue
		}
		if (e.k == 5) {
			drawCoin(x, e.y, uniSize * 2.4, X * .008 + e.x * .055, BIGRING)
			continue
		}
		t = M.sin(X * .02 + e.x * .03) * .3
		C.save()
		C.translate(x, e.y)
		C.rotate(t)
		C.globalAlpha = .26
		C.fillStyle = gemColour[e.k]
		C.beginPath()
		C.arc(0, 0, uniSize * .46, 0, 7)
		C.fill()
		C.globalAlpha = 1
		C.fillStyle = C.strokeStyle = gemColour[e.k]
		C.lineCap = 'round'
		C.lineJoin = 'round'
		if (e.k == 0) {                                  // a shield
			C.beginPath()
			C.moveTo(0, -uniSize * .30)
			C.lineTo(uniSize * .24, -uniSize * .19)
			C.lineTo(uniSize * .24, uniSize * .04)
			C.quadraticCurveTo(uniSize * .24, uniSize * .24, 0, uniSize * .33)
			C.quadraticCurveTo(-uniSize * .24, uniSize * .24, -uniSize * .24, uniSize * .04)
			C.lineTo(-uniSize * .24, -uniSize * .19)
			C.closePath()
			C.fill()
			C.fillStyle = '#ffffff73'
			C.beginPath()
			C.moveTo(0, -uniSize * .24)
			C.lineTo(uniSize * .17, -uniSize * .16)
			C.lineTo(uniSize * .17, uniSize * .03)
			C.quadraticCurveTo(uniSize * .17, uniSize * .16, 0, uniSize * .23)
			C.closePath()
			C.fill()
		} else if (e.k == 1) {                             // a horseshoe magnet
			C.lineWidth = uniSize * .16
			C.lineCap = 'butt'
			C.beginPath()
			C.moveTo(-uniSize * .20, uniSize * .28)
			C.lineTo(-uniSize * .20, 0)
			C.arc(0, 0, uniSize * .20, PI, 0)
			C.lineTo(uniSize * .20, uniSize * .28)
			C.stroke()
			C.fillStyle = '#f2f2ff'
			C.fillRect(-uniSize * .28, uniSize * .16, uniSize * .16, uniSize * .13)
			C.fillRect(uniSize * .12, uniSize * .16, uniSize * .16, uniSize * .13)
		} else if (e.k == 2) {                             // coins counted double
			C.font = 'bold ' + (uniSize * .46|0) + 'px sans-serif'
			C.textAlign = 'center'
			C.fillText('×2', 0, uniSize * .17)
		} else if (e.k == 3) {                             // turbo, two chevrons
			for (j = 0; j < 2; j++) {
				C.beginPath()
				C.moveTo(uniSize * (-.30 + j * .26), -uniSize * .26)
				C.lineTo(uniSize * (-.04 + j * .26), 0)
				C.lineTo(uniSize * (-.30 + j * .26), uniSize * .26)
				C.lineTo(uniSize * (-.17 + j * .26), 0)
				C.closePath()
				C.fill()
			}
		} else if (e.k == 4) {                             // the gold rush, a radiating coin
			C.beginPath()
			C.arc(0, 0, uniSize * .18, 0, 7)
			C.fill()
			C.lineWidth = uniSize * .055
			for (j = 0; j < 4; j++) {
				g = j * 1.5708 + .39
				C.beginPath()
				C.moveTo(M.cos(g) * uniSize * .23, M.sin(g) * uniSize * .23)
				C.lineTo(M.cos(g) * uniSize * .33, M.sin(g) * uniSize * .33)
				C.stroke()
			}
		}
		C.restore()
	}

	for (i = 0; i < zaps.length; i++) {
		e = zaps[i]
		x = uniX + e.x - X
		if (x < -300 || x > W + 300) {
			continue
		}
		q = getZapEnds(e)
		drawBolt(uniX + q[0] - X, q[1], uniX + q[2] - X, q[3], invuln)
	}

	for (i = 0; i < hazards.length; i++) {
		e = hazards[i]
		x = uniX + e.x - X
		if (x < -70 || x > W + 70) {
			continue
		}
		if (e.t == 2) {                                // a current: blue it lifts, amber it pushes down
			q = e.v < 0
			C.fillStyle = q ? '#96e1ff21' : '#ffb96e21'
			C.fillRect(x - e.w / 2, ceilY, e.w, playH)
			C.strokeStyle = q ? '#c8f5ff80' : '#ffd49b80'
			C.lineWidth = 4
			C.lineCap = 'round'
			for (j = 0; j < 7; j++) {
				y = q ? floorY - ((now * .3 + j * 110) % playH) : ceilY + ((now * .3 + j * 110) % playH)
				g = x - e.w / 2 + e.w * (j + .5) / 7
				C.beginPath()
				C.moveTo(g, y)
				C.lineTo(g, y + e.v * playH * .13)
				C.moveTo(g - 8, y + e.v * playH * .09)
				C.lineTo(g, y + e.v * playH * .13)
				C.lineTo(g + 8, y + e.v * playH * .09)
				C.stroke()
			}
			continue
		}
		if (e.w > 0) {                                 // it shakes and warns before dropping
			C.fillStyle = worlds[k][2]
			C.beginPath()
			C.arc(x + M.sin(now * .05) * uniSize * .08, e.y, uniSize * .21, 0, 7)
			C.fill()
			C.strokeStyle = 'rgba(255,90,90,' + (M.sin(now * .02) > 0 ? .9 : .3) + ')'
			C.lineWidth = 4
			C.beginPath()
			C.moveTo(x - uniSize * .16, e.y + uniSize * .34)
			C.lineTo(x, e.y + uniSize * .52)
			C.lineTo(x + uniSize * .16, e.y + uniSize * .34)
			C.stroke()
			continue
		}
		C.fillStyle = worlds[k][2]                       // a falling block
		C.beginPath()
		C.arc(x, e.y, uniSize * .21, 0, 7)
		C.fill()
		C.fillStyle = '#ffffff38'
		C.beginPath()
		C.arc(x - uniSize * .07, e.y - uniSize * .07, uniSize * .09, 0, 7)
		C.fill()
	}

	for (i = 0; i < missiles.length; i++) {
		e = missiles[i]
		x = uniX + e.x - X
		if (e.t > 0) {                                   // the blinking warning marker
			if (M.sin((1.2 - e.t) * 22) > 0) {
				C.fillStyle = '#ff3b3b'
				C.beginPath()
				C.moveTo(W - 6, e.y)                     // sized on the band, like everything else
				C.lineTo(W - ceilY * .64, e.y - ceilY * .36)
				C.lineTo(W - ceilY * .64, e.y + ceilY * .36)
				C.closePath()
				C.fill()
			}
			continue
		}
		C.fillStyle = '#8f8aa8'                        // the body
		C.beginPath()
		C.roundRect(x - uniSize * .02, e.y - uniSize * .09, uniSize * .34, uniSize * .18, uniSize * .06)
		C.fill()
		C.fillStyle = '#ff4d4d'                        // the warhead
		C.beginPath()
		C.moveTo(x - uniSize * .22, e.y)
		C.lineTo(x - uniSize * .02, e.y - uniSize * .09)
		C.lineTo(x - uniSize * .02, e.y + uniSize * .09)
		C.closePath()
		C.fill()
		C.fillStyle = '#6d6884'                        // the fins
		C.beginPath()
		C.moveTo(x + uniSize * .32, e.y - uniSize * .08)
		C.lineTo(x + uniSize * .44, e.y - uniSize * .18)
		C.lineTo(x + uniSize * .44, e.y + uniSize * .18)
		C.lineTo(x + uniSize * .32, e.y + uniSize * .08)
		C.closePath()
		C.fill()
		C.fillStyle = '#ffbe50d9'           // the flame
		C.beginPath()
		C.arc(x + uniSize * (.46 + M.random() * .12), e.y, uniSize * (.07 + M.random() * .04), 0, 7)
		C.fill()
	}

	for (i = 0; i < sparks.length; i++) {
		e = sparks[i]
		x = uniX + e.x - X
		if (e.k) {                                     // a shockwave opening and fading
			C.strokeStyle = 'hsla(' + e.h + ',100%,72%,' + e.l + ')'
			C.lineWidth = uniSize * (.010 + e.l * .021)
			C.beginPath()
			C.arc(x, e.y, (1 - e.l) * uniSize * (e.k > 1 ? .95 : .6), 0, 7)
			C.stroke()
		} else {
			C.fillStyle = 'hsla(' + e.h + ',95%,66%,' + e.l + ')'
			C.beginPath()
			C.arc(x, e.y, uniSize * (.016 + e.l * .042), 0, 7)
			C.fill()
		}
	}

	if (invuln && state == 1) {                             // the halo says you are invulnerable
		C.strokeStyle = gemColour[gemTime[0] > 0 ? 0 : 3]
		C.globalAlpha = .45 + M.sin(X * .05) * .2
		C.lineWidth = 3
		C.beginPath()
		C.arc(uniDrawX, Y, haloR + 11, 0, 7)
		C.stroke()
		C.globalAlpha = 1
	}
	if (!(hurtTime > 0 && M.sin(hurtTime * 42) < 0)) {
		drawUnicorn(uniDrawX, Y, uniSize, tilt, legPhase)
	}

	C.restore()

	paintWorld(drawGround, k)

	// ---------- interface ----------
	// The fuel left, centred at the top on a small dark panel so it reads over any
	// sky. A figure rather than a bar: a fixed length could never carry an
	// unbounded quantity, and the tenth of a second is exactly what you watch
	// once it gets tight.
	t = timeLeft.toFixed(1) + 's'
	C.font = 'bold ' + (ceilY * .62|0) + 'px sans-serif'
	q = C.measureText(t).width
	C.fillStyle = '#000000a8'
	C.beginPath()
	C.roundRect(W / 2 - q / 2 - ceilY * .35, ceilY * .14, q + ceilY * .7, ceilY * .74, ceilY * .18)
	C.fill()
	C.textAlign = 'center'
	C.fillStyle = timeLeft < 10 && M.sin(now * .012) > 0 ? '#f55' : '#fff'
	C.fillText(t, W / 2, ceilY * .72)
	C.textAlign = 'right'
	C.fillStyle = '#fff'
	C.font = 'bold ' + (ceilY * .55|0) + 'px sans-serif'
	C.fillText(dist + ' m', W - ceilY * 1.3, ceilY * .74)
	if (state == 1) {                                // the cross goes back to the title
		C.strokeStyle = '#ffffff80'
		C.lineWidth = ceilY * .07
		C.lineCap = 'round'
		C.beginPath()
		C.moveTo(W - ceilY * .72, ceilY * .33)
		C.lineTo(W - ceilY * .36, ceilY * .69)
		C.moveTo(W - ceilY * .36, ceilY * .33)
		C.lineTo(W - ceilY * .72, ceilY * .69)
		C.stroke()
	}
	t = 0
	for (i = 0; i < 5; i++) {
		if (gemTime[i] > 0) {
			t++
		}
	}
	if (t) {
		g = M.min(ceilY * 2.4, (W - ceilY * 4) / t - ceilY * .17)            // the gauges tighten when many are active
		C.textAlign = 'center'
		C.font = 'bold ' + (ceilY * .26|0) + 'px sans-serif'
		y = 0
		for (i = 0; i < 5; i++) {
			if (gemTime[i] > 0) {
				x = W / 2 + (y - (t - 1) / 2) * (g + ceilY * .17)
				y++
				C.fillStyle = '#000000a8'
				C.beginPath()
				C.roundRect(x - g / 2 - ceilY * .1, H - ceilY * .8, g + ceilY * .2, ceilY * .6, ceilY * .12)
				C.fill()
				C.fillStyle = gemColour[i]
				C.fillText(['SHIELD', 'MAGNET', 'DOUBLE', 'TURBO', 'RUSH'][i], x, H - ceilY * .55)
				C.fillRect(x - g / 2, H - ceilY * .38, g * M.min(1, gemTime[i] / gemDur[i]), ceilY * .13)
			}
		}
	}

	C.textAlign = 'center'

	// ---- the fade to black and the stage title ----
	if (state == 1 && stagePhase != 1) {
		g = stagePhase == 3 ? M.min(1, phaseTime / .45) : stagePhase == 4 ? 1 : stagePhase == 0 ? M.max(0, 1 - phaseTime / .5) : 0
		if (g > 0) {
			C.fillStyle = 'rgba(0,0,0,' + g + ')'
			C.fillRect(0, 0, W, H)
		}
		if (stagePhase == 4) {
			C.fillStyle = endless ? '#ff5a5a' : '#fff'
			C.font = 'bold ' + (H * .10|0) + 'px sans-serif'
			C.fillText(stage == worlds.length ? 'ENDLESS MODE' : 'STAGE ' + (stage + 1), W / 2, H * .40)
			C.fillStyle = worlds[k][3]
			C.font = 'bold ' + (H * .065|0) + 'px sans-serif'
			C.fillText(worlds[k][4], W / 2, H * .54)
			if (endless) {
				C.fillStyle = '#ffcf4d'
				C.font = 'bold ' + (H * .045|0) + 'px sans-serif'
				C.fillText('no more coins', W / 2, H * .70)
			}
		}
	}

	if (state == 0) {
		drawHomeSky()                                 // the same place as the home screen
		drawTitle(M.max(16, H * .08), H * .15)        // the same name, two thirds the size
		q = M.round(carPos)                               // from the furthest to the nearest
		for (j = 3; j > 0; j--) {
			drawStageCard(q - j)
			drawStageCard(q + j)
		}
		drawStageCard(q)
		// The whole point of the game is how far you get, so the figure belongs on the
		// screen where you decide to play, not only on the one before it.
		if (best) {
			C.fillStyle = '#c8bff0'
			C.font = 'bold ' + (M.max(13, H * .042) | 0) + 'px sans-serif'
			C.fillText('BEST ' + best + ' m', W / 2, H * .265)
		}
		drawWalker()
	}

	if (state == 2) {
		C.fillStyle = '#0b0722cc'
		C.fillRect(0, 0, W, H)
		// Everything here is a multiple of one unit that follows the height of the
		// display. It used to be fixed pixels, so on a phone held sideways the
		// distance alone took a seventh of the screen.
		q = M.max(15, H * .047)
		y = H * .38
		C.fillStyle = '#ff8a8a'
		C.font = 'bold ' + (q | 0) + 'px sans-serif'
		C.fillText('OUT OF FUEL', W / 2, y - q * 4.4)
		C.fillStyle = '#c8bff0'
		C.font = (q * .67 | 0) + 'px sans-serif'
		C.fillText('coins are fuel, knocks spill it', W / 2, y - q * 3.27)
		C.fillStyle = '#fff'
		C.font = 'bold ' + (q * 2.27 | 0) + 'px sans-serif'
		C.fillText(dist + ' m', W / 2, y)
		C.fillStyle = '#ffcf4d'
		C.font = 'bold ' + (q * 1.33 | 0) + 'px sans-serif'
		C.fillText('stage ' + (stage + 1), W / 2, y + q * 2.13)
		C.fillStyle = '#c8bff0'
		C.font = (q | 0) + 'px sans-serif'
		C.fillText('best ' + best + ' m', W / 2, y + q * 4.27)
	}
}

// ---------- the home screen ----------

// The first screen the game shows. It owes nothing to the run: every shape here
// is computed from the clock alone, so there is no update step to write and
// nothing to reset when we leave. A tap or any key opens the stage list.
// The profile of one range of hills at the foot of the home screen.
//   range  which one, 0 the furthest away
//   x      where across the screen
// Two waves of different lengths, so no range repeats itself across the width.
function getRidgeY(range, x) {
	return H * (.70 + range * .07) + M.sin(x * (.004 + range * .0016) + range * 2.1) * H * .035
		+ M.sin(x * (.011 + range * .003) + range) * H * .016
}

// The sky that the home screen and the stage list share: a night gradient,
// stars, aurora and the unicorns crossing. It stands on its own so that the
// two screens are plainly the same place.
function drawHomeSky() {
	var i, j, t, x, y, g, a, s, d, q, vx, sw, sf, sv
	t = now * .001

	// the night sky, warmer towards the ground
	g = C.createLinearGradient(0, 0, 0, H)
	g.addColorStop(0, '#0a0524')
	g.addColorStop(.6, '#2b1152')
	g.addColorStop(1, '#5c1f5a')
	C.fillStyle = g
	C.fillRect(0, 0, W, H)

	// the stars: hashed spots, so they never drift, each breathing on its own
	C.fillStyle = '#fff'
	for (i = 0; i < 60; i++) {
		s = 1 + getHash(i + 7) * 1.8
		C.globalAlpha = .25 + .6 * M.abs(M.sin(t * .9 + i * 1.7))
		C.fillRect(getHash(i) * W, getHash(i + 99) * H * .72, s, s)
	}

	// three aurora curtains, each drifting at its own pace
	for (i = 0; i < 3; i++) {
		C.globalAlpha = .11
		C.fillStyle = 'hsl(' + (t * 18 + i * 70) + ',90%,62%)'
		C.beginPath()
		C.moveTo(0, H)
		for (x = 0; x <= W; x += W / 14) {
			C.lineTo(x, H * (.20 + i * .07) + M.sin(x * .0042 + t * .55 + i * 1.3) * H * .08)
		}
		// the last step of the loop can fall a hair short of W: without this the
		// curve is cut off in a straight diagonal at the right edge
		C.lineTo(W, H * (.20 + i * .07) + M.sin(W * .0042 + t * .55 + i * 1.3) * H * .08)
		C.lineTo(W, H)
		C.fill()
	}
	C.globalAlpha = 1

	// Four ranges of hills far below. A single black cut-out was tried and looked
	// pasted on: the trick is that each range keeps the colour of the sky and
	// only darkens a little, so they read as distance rather than as a hole.
	C.lineCap = 'round'
	for (i = 0; i < 4; i++) {
		C.fillStyle = 'hsl(' + (300 - i * 9) + ',' + (44 - i * 4) + '%,' + (24 - i * 5) + '%)'
		C.beginPath()
		C.moveTo(0, H)
		for (x = 0; x <= W; x += W / 24) {
			C.lineTo(x, getRidgeY(i, x))
		}
		C.lineTo(W, getRidgeY(i, W))                  // the loop can fall short of W
		C.lineTo(W, H)
		C.fill()
		// a breath of haze along the crest, or the edge reads as scissor work
		C.globalAlpha = .07
		C.strokeStyle = '#c9a6e8'
		C.lineWidth = H * .03
		C.beginPath()
		C.moveTo(0, getRidgeY(i, 0))
		for (x = W / 24; x <= W; x += W / 24) {
			C.lineTo(x, getRidgeY(i, x))
		}
		C.lineTo(W, getRidgeY(i, W))
		C.stroke()
		C.globalAlpha = 1
	}

	// Embers drifting up off the ranges, the same warm colour as the windows so
	// they read as rising from the villages. Where each one is comes from the
	// clock and a hash, like everything else on this screen: nothing to update,
	// nothing to reset when we leave.
	C.fillStyle = '#ffb765'
	for (i = 0; i < 30; i++) {
		a = (t * .06 + getHash(i + 77)) % 1           // how far up its climb it is
		x = getHash(i + 91) * W + M.sin(t * .7 + i) * H * .014
		C.globalAlpha = (1 - a) * a * 2.6
		C.beginPath()
		C.arc(x, getRidgeY(i % 4, x) - a * H * .38, H * .003 + getHash(i) * H * .0028, 0, 7)
		C.fill()
	}
	C.globalAlpha = 1

	// windows lit along the two nearest ranges
	C.fillStyle = '#ffcf8a'
	for (i = 0; i < 26; i++) {
		x = getHash(i + 51) * W
		j = 2 + i % 2
		C.globalAlpha = .2 + .8 * M.abs(M.sin(t * 1.6 + i * 2.3))
		C.fillRect(x, getRidgeY(j, x) + H * .012 + getHash(i + 63) * H * .035, 2, 2)
	}
	C.globalAlpha = 1

	// A shooting star now and then, so that something happens for whoever stays
	// on this screen. One every seven seconds, from a spot the cycle number
	// fixes, so it never comes twice from the same place.
	a = t % 7
	if (a < .9) {
		q = M.floor(t / 7)
		x = getHash(q) * W * .6 + a / .9 * W * .5
		y = getHash(q + 5) * H * .3 + a / .9 * H * .22
		C.globalAlpha = M.sin(a / .9 * PI) * .9
		C.strokeStyle = '#fff'
		C.lineCap = 'round'
		C.lineWidth = H * .004
		C.beginPath()
		C.moveTo(x, y)
		C.lineTo(x - W * .07, y - H * .031)
		C.stroke()
		C.globalAlpha = 1
	}

	// Four coins drifting far away, the same object as the one in the name and
	// the ones you fly through. Dimmed, because they are meant to be distant.
	for (i = 0; i < 4; i++) {
		s = playH * (.09 + i * .022)
		a = (t * (.017 + i * .005) + getHash(i + 33)) % 1
		C.globalAlpha = .28
		drawCoin(a * (W + s * 4) - s * 2,
			H * (.2 + getHash(i + 41) * .34) + M.sin(t * .5 + i) * H * .02,
			s, t * 1.3 + i, COIN)
		C.globalAlpha = 1
	}

	// The unicorns crossing, the nearest one larger, faster and lower. She is
	// drawn by the same routine as in the run, which reads three globals of its
	// own: we lend them values and hand them back.
	sw = wingPhase
	sf = flyBlend
	sv = vertSpeed
	flyBlend = 1
	vertSpeed = 0
	for (i = 0; i < 3; i++) {
		s = playH * (.11 + i * .05)
		vx = (.07 + i * .028) * (W + s * 4)            // how fast she crosses, in pixels
		// a crossing, then a pause off the right edge before she comes round again
		a = (t * (.07 + i * .028) + i * .41) % 1.35
		x = a * (W + s * 4) - s * 2
		y = H * (.26 + i * .19) + M.sin(t * 1.1 + i * 2.2) * H * .045
		wingPhase = t * 8.5 + i * 2
		// The rainbow is the path she really flew: we walk back in time and put a
		// point where she was then, so it bends exactly as she bent. The gradient
		// runs the way she came from, so the far end fades out into the sky.
		C.lineCap = 'round'
		for (j = 0; j < 7; j++) {
			g = C.createLinearGradient(x, 0, x - vx * 2.4, 0)
			g.addColorStop(0, 'hsla(' + j * 44 + ',95%,62%,.9)')
			g.addColorStop(.35, 'hsla(' + j * 44 + ',95%,62%,.42)')
			g.addColorStop(.75, 'hsla(' + j * 44 + ',95%,62%,0)')
			g.addColorStop(1, 'hsla(' + j * 44 + ',95%,62%,0)')
			C.strokeStyle = g
			C.lineWidth = s * .26 - j * s * .031
			C.beginPath()
			C.moveTo(x - s * .42, y + s * .06)
			for (d = .15; d < 2.4; d += .15) {
				C.lineTo(x - s * .42 - d * vx,
					H * (.26 + i * .19) + M.sin((t - d) * 1.1 + i * 2.2) * H * .045 + s * .06)
			}
			C.stroke()
		}
		drawUnicorn(x, y, s, M.sin(t * 1.1 + i * 2.2) * .16, wingPhase)
	}
	wingPhase = sw
	flyBlend = sf
	vertSpeed = sv
}

// The six letters of the name, drawn as paths rather than as text. A tube of
// neon is a single line bent into a shape: text can only be outlined, which
// gives two lines per stem and no way to light just a stretch of one. As paths
// they behave like the coin, which is why the coin looked right from the start.
//   M move  L line  Q quadratic curve, values in hundredths of the cap height,
//   the baseline at zero and the top at -100
var MOT = [
	'M62,-100L62,-28Q62,0,34,0Q10,0,10,-22',              // J
	'M74,-100L12,-100L12,0L74,0M12,-52L62,-52',           // E
	'M6,-100L78,-100M42,-100L42,0',                       // T
	0,                                                     // O, which is a coin
	'M12,-100L12,-32Q12,0,42,0Q72,0,72,-32L72,-100',      // U
	'M6,-100L78,-100M42,-100L42,0'                        // T
]
var LARG = [.80, .92, .90, 1.24, .90, .90]
// Les lettres sont ecrasees en hauteur sans toucher a leur largeur : plus elles
// sont hautes et etroites, plus le O, qui est rond, jure a cote d elles.
var HAUT = .84

// Strokes whatever path is current as a tube of neon: the same line drawn from
// the widest and palest to the thinnest and brightest, so the middle of the tube
// is the lit part and its rim the dark one. It is the coin's recipe, and it is
// what the name and the Play button have in common.
//   h  the hue
//   w  how thick the glass is
function drawTube(h, w) {
	C.lineCap = C.lineJoin = 'round'
	C.shadowColor = 'hsl(' + h + ',100%,60%)'
	C.shadowBlur = w * 1.6
	C.globalAlpha = .18
	C.strokeStyle = 'hsl(' + h + ',95%,62%)'
	C.lineWidth = w * 1.6
	C.stroke()
	C.globalAlpha = 1
	C.shadowBlur = 0
	C.strokeStyle = 'hsl(' + h + ',95%,30%)'      // the glass at the rim
	C.lineWidth = w
	C.stroke()
	C.strokeStyle = 'hsl(' + h + ',95%,52%)'      // the gas
	C.lineWidth = w * .72
	C.stroke()
	C.strokeStyle = 'hsl(' + h + ',100%,74%)'     // the lit core, down the middle
	C.lineWidth = w * .36
	C.stroke()
}

// Lays one letter's path down, ready to be stroked.
//   d     its description
//   size  the height of a capital
function drawGlyph(d, size) {
	var i, v, seg = d.split(/(?=[MLQ])/)
	C.beginPath()
	for (i = 0; i < seg.length; i++) {
		v = seg[i].slice(1).split(',')
		v = [v[0] * size / 100, v[1] * size * HAUT / 100, v[2] * size / 100, v[3] * size * HAUT / 100]
		if (seg[i][0] == 'M') {
			C.moveTo(v[0], v[1])
		} else if (seg[i][0] == 'L') {
			C.lineTo(v[0], v[1])
		} else {
			C.quadraticCurveTo(v[0], v[1], v[2], v[3])
		}
	}
}

// The name. Each letter is a tube: the same path stroked several times, from the
// widest and palest to the thinnest and brightest, so the middle of the tube is
// the lit part and its rim the dark one. The last pass is the reflection on the
// glass: a short dash on one stretch only, offset up and to the left, the same
// thing as the little arc on the coin.
//   size  the height of a capital
//   atY   the baseline
function drawTitle(size, atY) {
	var i, x, y, h, q = 0, t = now * .001
	for (i = 0; i < 6; i++) {
		q += LARG[i] * size
	}
	x = W / 2 - q / 2
	C.lineCap = C.lineJoin = 'round'
	for (i = 0; i < 6; i++) {
		y = atY + M.sin(t * 3 - i * .55) * size * .13
		h = i * 40 + t * 55
		if (MOT[i]) {
			C.save()
			C.translate(x, y)
			drawGlyph(MOT[i], size)
			drawTube(h, size * .29)
			// The reflection runs the whole length of the tube, a hair above and
			// to the left of its middle. A tube catches the light all along, not
			// in patches: the short arc on the coin only looks like a patch
			// because a ring closes on itself.
			C.translate(-size * .028, -size * .034)
			drawGlyph(MOT[i], size)
			C.globalAlpha = .8
			C.strokeStyle = '#fff'
			C.lineWidth = size * .036
			C.stroke()
			C.globalAlpha = 1
			C.restore()
		} else {
			drawCoin(x + LARG[i] * size / 2, y - size * HAUT / 2, size * HAUT * 2.6,
				t * 2, COIN)
		}
		x += LARG[i] * size
	}
}

// A unicorn trots along the bottom edge every half minute, on the home screen as
// well as on the stage list: neither owes anything to the run, but neither should
// be a still picture. flyBlend decides between folded legs and walking ones, so
// we force it and hand it back.
function drawWalker() {
	var p = (now * .00007) % 2, f
	if (p < 1) {
		f = flyBlend
		flyBlend = 0
		drawUnicorn(p * (W + H * .4) - H * .2, H - H * .069, H * .14, 0, now * .0075)
		flyBlend = f
	}
}

// The home screen: the shared sky, then the name, the best run and the button.
function drawHome() {
	var t, y, a, bw, bh, bx, by
	t = now * .001
	drawHomeSky()
	drawWalker()

	y = H * .30
	drawTitle(M.max(25, H * .124), y)

	// The name is drawn as paths now, so nothing sets this any more and the two
	// lines below would hang off to the left.
	C.textAlign = 'center'
	if (best) {
		C.fillStyle = '#c8bff0'
		C.font = 'bold ' + (M.max(13, H * .042) | 0) + 'px sans-serif'
		C.fillText('BEST ' + best + ' m', W / 2, y + H * .10)
	}

	// The Play button. A tap anywhere does the same thing: the button is the
	// invitation, not a target you have to find.
	bw = M.max(140, W * .19)
	bh = M.max(40, H * .105)
	bx = W / 2 - bw / 2
	by = H * .60
	a = .5 + .5 * M.sin(t * 2.6)
	// A capsule of neon, the same object as the name and the coin: a hollow
	// tube, barely darkened inside so the word stays readable, with the glass
	// catching the light along its top. It breathes on the pulse.
	C.beginPath()
	C.roundRect(bx, by, bw, bh, bh / 2)
	C.fillStyle = '#0a221d99'
	C.fill()
	drawTube(158, bh * .15 + a * bh * .03)
	C.globalAlpha = .6
	C.strokeStyle = '#fff'
	C.lineWidth = bh * .045
	C.beginPath()
	C.moveTo(bx + bh * .5, by - bh * .04)
	C.lineTo(bx + bw - bh * .5, by - bh * .04)
	C.stroke()
	C.globalAlpha = 1
	C.shadowColor = '#7dffd4'
	C.shadowBlur = 10 + a * 14
	C.fillStyle = '#e6fff6'
	C.font = 'bold ' + (bh * .42 | 0) + 'px sans-serif'
	C.fillText('PLAY', W / 2, by + bh * .62)
	C.shadowBlur = 0

	C.fillStyle = '#9b93c4'
	C.font = (M.max(11, H * .032) | 0) + 'px sans-serif'
	C.fillText('tap the screen or press any key', W / 2, H * .88)
}

// ---------- portrait screen ----------

// The screen shown when the phone is held upright. The game is landscape only,
// so rather than squeeze it we ask the player to turn the phone.
function drawPortraitNotice() {
	//var a = -PI / 2 * M.min(1, M.max(0, (M.sin(now * .0018) + .4) * 1.1)), 
/*	var w = W * .16, h = w * 1.75
	C.fillStyle = '#0b0722'
	C.fillRect(0, 0, W, H)
	C.save()
	C.translate(W / 2, H * .42)
	//C.rotate(a)
	C.strokeStyle = '#fff'
	C.lineWidth = 4
	C.beginPath()
	C.roundRect(-w / 2, -h / 2, w, h, w * .16)
	C.stroke()
	C.fillStyle = '#ffffff29'
	C.beginPath()
	C.roundRect(-w / 2 + 7, -h / 2 + 13, w - 14, h - 26, w * .06)
	C.fill()
	C.restore()
*/

	C.textAlign = 'center'
	C.fillStyle = '#fff'
	C.font = 'bold 20px sans-serif'
	C.fillText('Rotate your phone', W / 2, H / 2)
	C.fillStyle = '#c8bff0'
	C.font = '15px sans-serif'
	C.fillText('Jetout is played in landscape.', W / 2, H / 2 + 28)
}

// The animation loop. Measures the time gone by, advances the game, paints it,
// then asks the browser for the next frame.
//   nowMs  the timestamp the browser hands us, in milliseconds
function runFrame(nowMs) {
	var dt = M.min(.05, (nowMs - last) / 1000 || 0)
	last = nowMs
	now = nowMs
	if (!dragging && state == 0) {
		carPos += (carAim - carPos) * M.min(1, dt * 12)
	}
	if (port) {
		hold = 0
		if (thr) {
			thr.gain.value = 0
		}
		drawPortraitNotice()
	} else if (state == 4) {
		hold = 0
		drawHome()
	} else {
		updateGame(dt)
		drawFrame()
	}
	scheduleMusic()
	requestAnimationFrame(runFrame)
}

// ---------- input ----------

var DE = document.documentElement

// Goes fullscreen and locks the screen in landscape. Both are only granted
// during a gesture, which is why this hangs off the first tap.
function enterFullscreen() {
	try {
		if (DE.requestFullscreen) {
			DE.requestFullscreen().catch(function() {})
		}
		if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(function() {})
		}
	} catch (e) {}
}

c.onpointerdown = function(e) {
	e.preventDefault()
	c.setPointerCapture(e.pointerId)
	initAudio()
	if (port) {
		return
	}
	// Chrome on Android covers the top of the screen with a swipe-to-exit
	// banner for several seconds. So we go fullscreen on a tap that starts
	// nothing: the banner sits over the title screen, not over the game.
	if (state != 1 && state != 3 && DE.requestFullscreen && !document.fullscreenElement) {
		enterFullscreen()
		return
	}
	// on the home screen, anywhere at all opens the stage list
	if (state == 4) {
		state = 0
		return
	}
	// on the title, a press opens a drag: nothing is decided until release
	if (state == 0 && e.clientY < H - 46) {
		dragging = 1
		dragX0 = e.clientX
		dragFrom = carPos
		dragDist = 0
		return
	}
	if (state == 1 && e.clientX > W - ceilY * 1.2 && e.clientY < ceilY * 1.25) {   // the cross: we quit
		hold = 0
		resetRun()
		return
	}
	hold = 1
	if (state == 1 || state == 3) {
		return                 // during the fall, no restart
	}
	if (state == 2) {                                // the end screen goes back to the title
		if (shake > .6) {
			return
		}
		resetRun()
		return
	}
	resetRun()
	state = 1
}
c.onpointermove = function(e) {
	if (dragging) {
		carPos = dragFrom - (e.clientX - dragX0) / cardW
		dragDist = M.max(dragDist, M.abs(e.clientX - dragX0))
		if (carPos < 0) {
			carPos = 0
		}
		if (carPos > worlds.length) {
			carPos = worlds.length
		}
	}
}
c.onpointerup = c.onpointercancel = function() {
	if (dragging) {
		dragging = 0
		carAim = M.max(0, M.min(worlds.length, M.round(carPos)))
		if (dragDist < 9 && getStartTime(carAim) > 0) {                       // a tap, not a drag
			resetRun(carAim)
			state = 1
		}
	}
	hold = 0
}
/*onwheel = function(e) {                           // the wheel scrolls through the stages
	if (state == 0) {
		carAim = M.max(0, M.min(worlds.length, M.round(carAim) + (e.deltaY > 0 ? 1 : -1)))
	}
}*/

onkeydown = function(e) {
	// On the home screen any key opens the stage list, and takes the chance to
	// wake the sound and go fullscreen: a browser grants both only on a gesture.
	if (state == 4 && !port) {
		initAudio()
		enterFullscreen()
		state = 0
		return
	}
	if (e.code == 'Escape' && !state) {                // from the list, back home
		state = 4
		return
	}
	// the arrow keys step through the stages, like the  drag
	if (state == 0 && (e.code == 'ArrowLeft' || e.code == 'ArrowRight')) {
		carAim = M.max(0, M.min(worlds.length, M.round(carAim) + (e.code == 'ArrowRight' ? 1 : -1)))
		return
	}
	if (e.code == 'Escape' && state) {                 // we abandon the run
		hold = 0
		resetRun()
		return
	}
	// Space, Enter and the up arrow all mean the same thing: get off the ground.
	// slice(-5) catches Enter and NumpadEnter in one go.
	if ((e.code == 'Space' || e.code.slice(-5) == 'Enter' || e.code == 'ArrowUp') && !port) {
		initAudio()
		enterFullscreen()
		if (state == 1 || state == 3) {
			hold = 1
			return
		}
		if (e.code == 'ArrowUp') {
			return                                     // in the air only, the list uses the arrows
		}
		if (state == 2) {                              // the end screen goes back to the list
			resetRun()
			return
		}
		// The stage the carousel is showing, not the first one. resetRun() with
		// no argument opens on stage 1, which is why the space bar used to
		// always start the forest whatever was on screen.
		if (getStartTime(M.round(carAim)) > 0) {
			resetRun(M.round(carAim))
			state = 1
			hold = 1
		}
	}
}
onkeyup = function() {
	hold = 0
}
document.onfullscreenchange = function() {
	if (!document.fullscreenElement && (state == 1 || state == 3)) {
		hold = 0
		resetRun()
	}
}

onresize = function() {
	layoutScreen()
	if (!port) {
		if (Y > floorY - uniSize * .42) {
			Y = floorY - uniSize * .42
		}
		if (Y < ceilY + uniSize * .56) {
			Y = ceilY + uniSize * .56
		}
	}
}

// The Android Back button is what everyone tries first to leave a
// screen: we catch it to return to the title instead of leaving the page.
// From the title we let it through, or we would trap the player.
history.pushState(0, '')
onpopstate = function() {
	if (state == 1 || state == 3) {
		history.pushState(0, '')
		hold = 0
		resetRun()
	}
}

layoutScreen()
resetRun()
state = 4                          // the game opens on the home screen
requestAnimationFrame(runFrame)
</script>
</html>
