<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>复古街机厅 · Offline Arcade</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0b0618 radial-gradient(circle at 50% -20%,#3a0b5e,#0b0618 60%);color:#e8e8ff;font-family:"Courier New",monospace;min-height:100vh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
h1{text-align:center;font-size:42px;margin:24px 0 4px;color:#ff3df2;text-shadow:0 0 8px #ff3df2,0 0 24px #ff00c8,3px 3px 0 #2bf}
.sub{text-align:center;color:#7ff;letter-spacing:3px;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px}
input,select,button,label.btn{background:#140a2a;color:#ff0;border:2px solid #2bf;padding:8px 12px;font:inherit;border-radius:4px;cursor:pointer}
input{width:240px;cursor:text}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:0 24px 40px;max-width:1300px;margin:auto}
.card{background:#140a2a;border:2px solid #4a2b8a;border-radius:8px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-4px);border-color:#ff3df2;box-shadow:0 0 18px #ff3df2}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;image-rendering:pixelated;display:block}
.info{padding:8px 10px}.t{color:#ff0;font-weight:bold;font-size:15px}
.m{font-size:12px;color:#9cf;margin-top:4px}.lic{display:inline-block;margin-top:6px;font-size:11px;padding:1px 6px;border:1px solid #6f6;color:#6f6;border-radius:3px}
.sys{float:right;font-size:11px;color:#f8a}
footer{text-align:center;font-size:12px;color:#88a;padding-bottom:30px}a{color:#7ff}
</style></head><body>
<h1>★ 复古街机厅 ★</h1><div class="sub">INSERT COIN · 全部离线 · 仅收录开源/可自由分发的游戏</div>
<div class="bar"><input id="q" placeholder="搜索游戏 / 作者..."><select id="sys"><option value="">全部平台</option></select>
<select id="gen"><option value="">全部类型</option></select><select id="lic"><option value="">全部许可证</option></select>
<select id="zipcore" title="街机 zip 用哪个核心"><option value="mame">街机zip：MAME 2003-Plus</option><option value="fbneo">街机zip：FinalBurn Neo</option><option value="auto" selected>街机zip：自动（按资料库匹配）</option></select><label class="btn">▶ 打开我自己的游戏文件<input type="file" id="own" accept=".nes,.gb,.gbc,.gba,.zip,.swf" hidden></label></div>
<div style="max-width:1250px;margin:0 auto 16px;padding:10px 16px;border:1px dashed #fa0;color:#fc6;font-size:13px">🕹 标有“需自行下载”的是 MAME 官方免费街机 ROM：请到 <a href="https://www.mamedev.org/roms/" target="_blank">mamedev.org/roms</a> 下载对应 zip（不解压、不改名），放进 <b>my-roms/</b> 文件夹即可在本大厅直接玩。官方只允许在其网站分发，所以合集里没有附带。</div><div class="grid" id="grid"></div>
<footer><span id="cnt"></span> · 许可证详情见 <a href="LICENSES.md">LICENSES.md</a> · 播放器：EmulatorJS (GPL-3.0) / Ruffle (MIT/Apache-2.0)</footer>
<script src="games.js"></script><script src="my-games.js"></script><script src="meta-db.js"></script><script src="meta-match.js"></script><script src="idb.js"></script><script>
const $=id=>document.getElementById(id);
const SYSN={nes:'FC/NES',gb:'Game Boy',gbc:'Game Boy',gba:'GBA',mame:'街机 (MAME)',arcade:'街机 (FBNeo)',swf:'Flash',segaMD:'Mega Drive',sms:'Master System',gg:'Game Gear',snes:'SNES',pce:'PC Engine',atari2600:'Atari 2600',atari7800:'Atari 7800',lynx:'Lynx',ws:'WonderSwan',coleco:'ColecoVision',ngp:'Neo Geo Pocket',doom:'DOOM 引擎',html5:'HTML5'};
function enrich(g){const r=matchMeta(g.file||'');const m=r.meta||{};return Object.assign({system:r.system,systemName:SYSN[r.system]||m.system||'自有',genre:m.genre||'自有',author:m.developer||'',license:'自有备份',title:m.title||r.base,desc:m.description||'',year:m.year||''},g,{mine:true,matched:!!r.meta})}
let ALL=[...window.GAMES,...(window.MY_GAMES||[]).map(enrich)];
async function scanMyRoms(){try{const t=await (await fetch('my-roms/')).text();const files=[...t.matchAll(/href="([^"?\/]+\.[a-z0-9]{2,4})"/gi)].map(m=>decodeURIComponent(m[1])).filter(f=>!/\.(txt|md|html)$/i.test(f));
 const used=new Set(ALL.map(g=>(g.file||'').toLowerCase()));
 for(const f of files){const p='my-roms/'+f;if(used.has(p.toLowerCase()))continue;if(f.toLowerCase()==='neogeo.zip')continue;ALL.push(enrich({id:'my:'+f,file:p}))}}catch(e){}}
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120"><rect width="160" height="120" fill="#1a0f33"/><text x="80" y="66" fill="#ff3df2" font-family="monospace" font-size="14" text-anchor="middle">NO SIGNAL</text></svg>');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function fill(sel,key){const cur=sel.value;sel.length=1;[...new Set(ALL.map(g=>g[key]))].sort().forEach(v=>sel.add(new Option(v,v)));sel.value=cur}
function href(g){return g.mine&&!window.GAMES.includes(g)?`play.html?file=${encodeURIComponent(g.file)}&sys=${encodeURIComponent(g.system||'')}`:`play.html?id=${encodeURIComponent(g.id)}`}
function render(){const q=$('q').value.toLowerCase();
 const list=ALL.filter(g=>(!q||(g.title+(g.author||'')+g.genre+(g.desc||'')).toLowerCase().includes(q))&&(!$('sys').value||g.systemName==$('sys').value)&&(!$('gen').value||g.genre==$('gen').value)&&(!$('lic').value||g.license==$('lic').value));
 $('grid').innerHTML=list.map(g=>`<div class="card" title="${esc(g.desc||'')}" onclick="location.href='${href(g)}'"><img loading="lazy" src="${esc(g.cover||PH)}" onerror="this.src=PH"><div class="info"><span class="sys">${esc(g.systemName)}</span><div class="t">${esc(g.title)}</div><div class="m">${esc(g.genre)}${g.year?' · '+esc(g.year):''} · ${esc(g.author||'')}</div><span class="lic">${esc(g.license)}</span>${g.needsDownload?'<span class="lic" style="color:#fa0;border-color:#fa0;margin-left:4px">需自行下载</span>':''}${g.mine?`<span class="lic" style="color:#7ff;border-color:#7ff;margin-left:4px">${g.matched?'我的·已匹配资料':'我的'}</span>`:''}</div></div>`).join('');
 $('cnt').textContent=`共 ${list.length} / ${ALL.length} 个游戏`}
scanMyRoms().then(()=>{['sys','gen','lic'].forEach(k=>fill($(k),{sys:'systemName',gen:'genre',lic:'license'}[k]));render()});
['q','sys','gen','lic'].forEach(i=>$(i).oninput=render);
$('own').onchange=async e=>{const f=e.target.files[0];if(!f)return;await idbPut('own',{name:f.name,blob:f,zipCore:$('zipcore').value});location.href='play.html?own=1'};
</script></body></html>
